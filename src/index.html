<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Amal Sboui - Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    /* loading styling before angular */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #14151f;
      background-image:
        linear-gradient(rgba(124, 147, 212, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 147, 212, 0.06) 1px, transparent 1px);
      background-size: 48px 48px;
    }
        #initial-loader {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background-color: #14151f;
      background-image:
        linear-gradient(rgba(124, 147, 212, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 147, 212, 0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      opacity: 1;                  
      visibility: visible;         
      -webkit-transform: translateZ(0); 
      transform: translateZ(0);
      transition: opacity 0.5s ease;
    }
    #initial-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 4px solid rgba(124, 147, 212, 0.12);
      border-top-color: #7c93d4;
      border-right-color: #d88fb0;
      animation: ring-spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes ring-spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <link rel="icon" type="image/png" href="assets/images/icon-amal-right.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</head>

<body>
  <div id="initial-loader">
    <div class="ring"></div>
  </div>
  <app-root></app-root>

  <script>
    // Fallback: force-remove loader after 6s
    // Covers iOS WebView (Messenger, WhatsApp) where ngAfterViewInit fires late
    function dismissLoader() {
      const loader = document.getElementById('initial-loader');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 500);
      }
    }

    // If Angular hasn't dismissed it after 6s, do it ourselves
    const fallback = setTimeout(dismissLoader, 6000);

    // Also expose it so Angular can cancel the fallback when it's ready
    window.__loaderDismiss = function() {
      clearTimeout(fallback);
      dismissLoader();
    };
  </script>
</body>
</html>
